<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Bắt buộc: Cần thiết cho việc quản lý đường dẫn/định tuyến (Routing) trong Flutter -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ứng dụng Flutter Web</title>

  <!-- PWA & Web App Meta Tags -->
  <meta name="description" content="Ứng dụng được biên dịch từ Flutter">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter App">
  <link rel="manifest" href="manifest.json">

  <!-- CSS tạo hiệu ứng Loading trong lúc chờ Flutter Engine nạp xong -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0175C2;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- File hỗ trợ khởi tạo ứng dụng của Flutter -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Màn hình chờ (Loading) xuất hiện khi ứng dụng đang khởi tạo -->
  <div id="loading-indicator" class="loading-container">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: #555;">Đang tải ứng dụng...</p>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      var loadingDiv = document.getElementById('loading-indicator');

      // Kiểm tra nếu có bộ nạp flutter.js chuẩn
      if (typeof _flutter !== 'undefined' && _flutter.loader) {
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            // Khởi tạo Engine (CanvasKit / HTML renderer)
            engineInitializer.initializeEngine().then(function(appRunner) {
              // Ẩn màn hình loading khi Engine sẵn sàng
              if (loadingDiv) loadingDiv.remove();
              
              // Chạy ứng dụng Flutter chính (kích hoạt main.dart.js)
              appRunner.runApp();
            });
          }
        });
      } else {
        // Phương án dự phòng: Nạp trực tiếp file main.dart.js nếu không có flutter.js
        var script = document.createElement('script');
        script.src = 'main.dart.js';
        script.type = 'text/javascript';
        script.onload = function() {
          if (loadingDiv) loadingDiv.remove();
        };
        document.body.appendChild(script);
      }
    });
  </script>
</body>
</html>
