<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thái Ất — HTML + JavaScript</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Thái Ất</h1>
      <!-- <p>Motoko → JavaScript: Types → Solar24 → Calendar Adapter → ThaiAt → Canvas</p> -->
    </div>
    <span id="engineStatus" class="badge">Đang khởi tạo…</span>
  </header>

  <section class="panel input-panel">
    <div class="fields">
      <label>Năm <input id="year" type="number" value="2026"></label>
      <label>Tháng <input id="month" type="number" min="1" max="12" value="9"></label>
      <label>Ngày <input id="day" type="number" min="1" max="31" value="30"></label>
      <label>Giờ <input id="hour" type="number" min="0" max="23" value="9"></label>
      <label>Phút <input id="minute" type="number" min="0" max="59" value="25"></label>
      <label>Kiểu kế
        <select id="keType">
          <option value="year">Tuế Kế</option>
          <option value="month">Nguyệt Kế</option>
          <option value="day">Nhật Kế (skeleton)</option>
          <option value="hour" selected>Thời Kế</option>
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="calculate">Lập trận</button>
      <button id="clearDebug" class="secondary">Xóa debug</button>
    </div>
    <p class="hint">Ngày/tháng/năm được dùng cho lịch Việt Nam GMT+7. Với Thời Kế, giờ/phút cũng tham gia tính toán.</p>
  </section>

  <main class="grid">
    <section class="panel board-panel">
      <div class="panel-title"><h2>Bát Quái Đồ</h2><span id="boardMeta"></span></div>
      <canvas id="batQuaiCanvas"></canvas>
    </section>

    <aside class="panel info-panel">
      <div class="panel-title"><h2>Thông tin</h2></div>
      <div id="summary" class="summary"></div>
    </aside>
  </main>

  <section class="panel debug-panel">
    <div class="panel-title">
      <h2>Debug / Trace</h2>
      <label class="inline-check"><input id="showRaw" type="checkbox"> Raw JSON</label>
    </div>
    <div id="debug" class="debug"></div>
    <pre id="rawDebug" class="raw hidden"></pre>
  </section>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
